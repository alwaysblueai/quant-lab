[project]
name = "alpha-lab"
version = "0.1.0"
description = "Level 1/2 quant research system for factor discovery and portfolio validation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "baostock>=0.8.9",
    "cvxpy>=1.6",
    "duckdb>=1.5.1",
    "ipykernel>=6.30.1",
    "jupyterlab>=4.4.10",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.8",
    "mypy>=1.18.2",
    "networkx>=3.6",
    "numpy>=2.3.3",
    "pandas>=2.3.2",
    "polars>=1.33.1",
    "pyarrow>=21.0.0",
    "pytest>=9.0.2",
    "ruff>=0.13.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
    "statsmodels>=0.14.6",
    "tushare>=1.4.29",
    "xgboost>=3.2.0",
]

[project.scripts]
alpha-lab = "alpha_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_lab"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
xfail_strict = true
markers = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
