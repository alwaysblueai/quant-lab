    M3:
      in_v1_contract: true
      implementation_status: "in_contract_factor_def"
      required_columns_missing: []
      validator_blockers: []
      reviewer_notes_by_engine:
        claude: "对应 mechanism_4：close_below_vwap × late_drop 的价格锚定精简版本，可作为低复杂度对照。"
        codex: "对应 mechanism_3：below_anchor_tail_gap，可加入 OHLC 极端状态过滤；但 v1 若只依赖 manifest 明列字段，应先不强行引入 OHLC guard。"
    M4:
