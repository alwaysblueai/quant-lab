    reason: "可执行但以截面分位门控为主，amihud 可能混入长期小盘/低流动性暴露；优先级低于自历史异常版本。"
  - mechanism_id: "M3"
    reason: "可作为对照，但丢掉成交集中与流动性冲击两个核心假设。"
  - mechanism_id: "M4"
