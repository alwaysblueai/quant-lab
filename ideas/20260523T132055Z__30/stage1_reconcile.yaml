  - "vault_refine: amount_share_close30 的预测力随 regime 衰减——docs/intraday_etl_contract.md:339 记 2024-2025 CS-IC≈+0.014(t=3.8) 但全 2016-2025 样本≈0(t=-0.74)，疑 2021 后量化拥挤。成交集中确认项可能是近期 regime 效应，Stage3 必须做 regime 切分，并将其与 price_core-only 对照。"
  - "vault_refine: amihud_intraday 重载 illiquidity/小盘暴露（20_methods/signal/Method - Structured Reversal Factor Construction → style_industry_neutralization_gate；30_factors/equity/Factor - Salience-Weighted Panic Reversal 同款）。Stage3 评估须在市值/行业/流动性中性化后判增量，否则可能只是小盘 bet。"
  - "rolling historical percentile 的窗口：payload v5 使用 W=40/min_periods=10（Stage1 草图曾写 60/20）。属版本迭代固定先验，可在后续版本调整但不能后验挑选。"
  - "若 amount_share_close30 的异常主要来自指数调仓/收盘集合竞价制度性流量，需在后续 diagnostics 检查日期聚集和行业/市值暴露。"
