      reviewer_notes_by_engine:
        claude: "对应 mechanism_6：把 amount_share_close30 与 amihud_intraday 做 per-asset rolling historical percentile，再与 late_drop 和 close_below_vwap 乘性合成；PIT-safe，要求 groupby('asset') rolling。"
        codex: "对应 mechanism_1：tail_drop_volume_knot，保留四项耦合假设，但慢变量异常值必须用 asset 历史窗口到 t 为止计算；过滤跌停和停牌。"
    M2:
      in_v1_contract: true
      implementation_status: "in_contract_factor_def"
      required_columns_missing: []
      validator_blockers: []
      reviewer_notes_by_engine:
        claude: "对应 mechanism_1/5：尾盘下跌为主体，成交集中、冲击成本、VWAP 偏离作为截面门控或交互条件。"
