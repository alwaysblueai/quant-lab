mechanisms:
  - id: "M1"
    name: "tail_drop_volume_knot"
    family: "intraday_microstructure"
    implementation_status: "in_contract_factor_def"
    stage2_priority: "primary_candidate"
    source_engines: ["claude", "codex"]
    hypothesis: "尾盘 30 分钟价格下压、尾盘成交额占比相对个股自身历史异常偏高、日内冲击成本相对自身历史异常偏高、且收盘低于 VWAP 同时出现时，更像临近收盘的承接不足或被动卖压堆叠，未来 1-5 日存在修复机会。"
    engine_data_generating_story: "先用 late_drop 和 close_below_vwap 定义当日尾盘价格锚偏离，再用 amount_share_close30 与 amihud_intraday 的 asset-grouped rolling historical percentile 判断该偏离是否发生在成交挤压和脆弱流动性状态中。"
    signal_sketch: "late_drop=max(-ret_last30,0); below_vwap=max(-vwap_close_dev,0); close_share_pct=rolling_pct_by_asset(amount_share_close30,W=60,min_periods=20); amihud_pct=rolling_pct_by_asset(amihud_intraday,W=60,min_periods=20); factor=late_drop*below_vwap*close_share_pct*amihud_pct; mask is_limit_down or is_suspended."
    required_columns: ["ret_last30", "amount_share_close30", "amihud_intraday", "vwap_close_dev", "is_limit_down", "is_suspended"]
    pit_requirements:
      - "rolling percentile must be grouped by asset"
      - "rolling window must use only current and historical rows up to t"
      - "factor is available after day-t close and intended for next-session or 3-5 day horizon"
    inspired_by: ["K1", "K2", "K4"]
    fusion_of: ["own-history anomaly", "close-window sampling", "VWAP-close anchor", "intraday impact cost"]
    novel_delta: "把原始四项乘积中的两个慢变量改为个股自身历史分位异常，避免 amihud 重尾或股票间永久流动性差异主导信号，同时保留四条件共振的核心假设。"
    concern: "仍是 AND/乘性结构，覆盖度可能较窄；若尾盘成交集中来自信息性卖出而非被动压力，短期修复逻辑会弱化。"
  - id: "M2"
    name: "tail_drop_soft_gate"
    family: "intraday_microstructure"
    implementation_status: "in_contract_factor_def"
    stage2_priority: "secondary_candidate"
    source_engines: ["claude", "codex"]
    hypothesis: "尾盘下跌是主信号，成交集中、日内冲击成本和 VWAP 偏离只作为是否像机械性冲击的软门控，而不是全部以原始尺度相乘。"
    engine_data_generating_story: "把 late_drop 作为主体位移，其他分量做截面 rank 或软权重，降低重尾变量和缺失值对整条信号的破坏。"
    signal_sketch: "factor=max(-ret_last30,0)*cs_rank(amount_share_close30)*cs_rank(amihud_intraday)*cs_rank(max(-vwap_close_dev,0)); mask is_limit_down/is_suspended."
    required_columns: ["ret_last30", "amount_share_close30", "amihud_intraday", "vwap_close_dev", "is_limit_down", "is_suspended"]
    pit_requirements:
      - "cross-sectional rank is same-date only"
      - "no future returns or labels"
    inspired_by: ["K2", "K3", "K4"]
    fusion_of: ["pressure-first trigger", "cross-sectional soft gates"]
    novel_delta: "用横截面分位门控替代原始数值乘积，提升尺度稳健性。"
    concern: "截面 amihud rank 可能隐含小盘/低流动性暴露，且没有解决个股自身异常定义问题。"
  - id: "M3"
    name: "below_anchor_tail_gap"
    family: "anchor_drift"
    implementation_status: "in_contract_factor_def"
    stage2_priority: "secondary_candidate"
    source_engines: ["claude", "codex"]
    hypothesis: "尾盘下跌并收在 VWAP 下方，表示价格相对日内成交锚短时偏离；该锚定偏离可能比成交额或 amihud 方向更稳定。"
    engine_data_generating_story: "只保留 late_drop × close_below_vwap 的价格锚定核心，用作低复杂度对照。"
    signal_sketch: "factor=max(-ret_last30,0)*max(-vwap_close_dev,0); mask is_limit_down/is_suspended."
    required_columns: ["ret_last30", "vwap_close_dev", "is_limit_down", "is_suspended"]
    pit_requirements:
      - "uses same-day close/VWAP-derived fields only after day-t close"
    inspired_by: ["K4", "K7"]
    fusion_of: ["VWAP-close shape", "tail displacement"]
    novel_delta: "有意做减法，检验量/冲击成本分量是否真有增量。"
    concern: "可能欠拟合联合流动性冲击事件；vwap_close_dev 的符号口径已由 docs/intraday_etl_contract.md:228 核定（正值=收在 VWAP 上方），不再是未决项。"
  - id: "M4"
    name: "component_coupling_audit"
    family: "intraday_microstructure"
    implementation_status: "partial_in_contract"
    stage2_priority: "secondary_candidate"
    source_engines: ["claude", "codex"]
    hypothesis: "四个子项的方向和组合方式未必都应该乘性耦合，可能需要 capped additive、two-of-four gate 或组件单调性审计。"
    engine_data_generating_story: "把每个成分作为独立贡献项，先观察边际方向，再决定是否需要强 AND。"
    signal_sketch: "factor=mean/rank blend of late_drop, close_share, amihud, below_vwap; or late_drop mandatory plus confirmation count."
    required_columns: ["ret_last30", "amount_share_close30", "amihud_intraday", "vwap_close_dev", "is_limit_down", "is_suspended"]
    pit_requirements:
      - "all rolling transforms must be asset-grouped"
      - "all cross-sectional transforms must be same-date only"
    inspired_by: ["K2", "K4"]
    fusion_of: ["component monotonicity before coupling"]
    novel_delta: "把组合方式本身作为研究对象。"
    concern: "若在一个 payload 中同时隐含多种组合，会形成后验挑选风险；不作为 v1 primary。"
  - id: "M5"
    name: "market_residual_tail_displacement"
    family: "intraday_microstructure"
    implementation_status: "partial_in_contract"
    stage2_priority: "defer"
    source_engines: ["claude"]
    hypothesis: "ret_last30 中全市场尾盘漂移应剥离，特异性尾盘下跌更可能是个股层面的被动冲击。"
    engine_data_generating_story: "以 ret_last30 的同日横截面去均值残差替代原始尾盘收益，再与 close_below_vwap 合成。"
    signal_sketch: "resid=ret_last30-cs_mean(ret_last30); factor=max(-resid,0)*max(-vwap_close_dev,0)."
    required_columns: ["ret_last30", "vwap_close_dev", "is_limit_down", "is_suspended"]
    pit_requirements:
      - "cross-sectional demean uses same-date universe only"
    inspired_by: ["K1"]
    fusion_of: ["structured residualization"]
    novel_delta: "把全市场尾盘共同移动从压力信号中剥离。"
    concern: "只剥离市场尾盘漂移，不能剥离个股当日趋势；完整形态需更多字段。"
  - id: "M6"
    name: "path_curl_tail_break"
    family: "other"
    implementation_status: "needs_extension"
    stage2_priority: "defer"
    source_engines: ["claude", "codex"]
    hypothesis: "同样尾盘跌幅下，后置型加速下杀或路径凸性可能区分可修复冲击与持续信息冲击。"
    engine_data_generating_story: "需要分钟价格路径、日内最大回撤或收益噪声变形列。"
    signal_sketch: "combine path curvature / intraday max drawdown / return noise deformation with late_drop and below_vwap."
    required_columns: ["ret_last30", "vwap_close_dev", "intraday_prices_or_minute_bar"]
    pit_requirements:
      - "requires registered intraday path features"
    inspired_by: ["K2", "K5", "K8"]
    fusion_of: ["price-path convexity", "return noise deformation"]
    novel_delta: "从终点收益扩展到完整日内路径形态。"
    concern: "当前 manifest 缺少路径字段，不进入 v1 payload。"
  - id: "M7"
    name: "toxic_flow_split"
    family: "intraday_microstructure"
    implementation_status: "needs_extension"
    stage2_priority: "defer"
    source_engines: ["codex"]
    hypothesis: "尾盘下跌和成交集中若伴随订单流毒性或盘口失衡，可能代表信息交易而非被动抛压。"
    engine_data_generating_story: "用 VWPIN/OIR/VOI/MPB/signed imbalance 区分 passive pressure 与 informed selling。"
    signal_sketch: "base tail-pressure score gated down by toxicity/order-book imbalance proxies."
    required_columns: ["ret_last30", "amount_share_close30", "vwap_close_dev", "vwpin_like_toxicity", "order_imbalance_ratio"]
    pit_requirements:
      - "requires registered order-flow/order-book features"
    inspired_by: ["K6", "K7"]
    fusion_of: ["order-flow toxicity", "close-window pressure"]
    novel_delta: "把被动压力和信息性卖压拆成两条分支。"
    concern: "当前字段不足，不能当作 Stage1 kill condition，也不能写进 v1 payload。"
stage2_entry_recommendation:
  primary_mechanism_ids: ["M1"]
  recommended_factor_slug: "tail_drop_volume_knot_v1"
  reason: "M1 同时吸收了 Claude 的 PIT-safe 自历史异常机制和 Codex 的 tail_drop_volume_knot 主假设，完全使用当前 manifest 字段，满足 asset-grouped rolling、无未来函数、无全样本标准化要求；相比截面 gate 更能表达“相对个股自身历史异常”的原始设计。"
  must_preserve_mechanisms_as_context: ["M2", "M3", "M4", "M5", "M6", "M7"]
