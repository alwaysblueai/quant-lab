name: vcimom20_5_webui_demo
factor_name: vcimom20_5
factor_path: ./placeholder_factor.csv
prices_path: ./placeholder_prices.csv
factor_input:
  mode: recipe
  disable_pipeline_preprocess: true
  recipe:
    base:
      method: vcimom
      residual_window: 60
      momentum_window: 20
      skip_recent: 4
      confirm_window: 10
      penalty_window: 5
      amount_window: 20
      confirm_weight: 0.6
      penalty_weight: 0.4
    preprocess:
      winsorize:
        enabled: true
        lower: 0.01
        upper: 0.99
        min_group_size: 5
      standardization:
        method: zscore
        min_group_size: 5
      min_coverage: 0.2
rebalance_frequency: W
n_quantiles: 5
direction: long
universe:
  name: baostock_all_a
  path: ./placeholder_universe.csv
  in_universe_column: in_universe
target:
  kind: forward_return
  horizon: 5
preprocess:
  winsorize: false
  winsorize_lower: 0.01
  winsorize_upper: 0.99
  standardization: none
  min_group_size: 5
transaction_cost:
  one_way_rate: 0.001
output:
  root_dir: dist/web_ui_runs
