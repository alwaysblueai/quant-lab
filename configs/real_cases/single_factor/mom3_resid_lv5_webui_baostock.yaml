name: mom3_resid_lv5_webui_demo
factor_name: mom3_resid_lv5
factor_path: ./placeholder_factor.csv
prices_path: ./placeholder_prices.csv
factor_input:
  mode: recipe
  disable_pipeline_preprocess: true
  recipe:
    base:
      method: momentum
      window: 3
    preprocess:
      winsorize:
        enabled: true
        lower: 0.01
        upper: 0.99
        min_group_size: 5
      standardization:
        method: zscore
        min_group_size: 5
      min_coverage: 0.2
    orthogonalize:
      enabled: true
      exposures:
        - method: low_volatility
          window: 5
      min_obs: 20
      ridge: 1.0e-8
rebalance_frequency: M
n_quantiles: 5
direction: long
universe:
  name: baostock_all_a
  path: ./placeholder_universe.csv
  in_universe_column: in_universe
target:
  kind: forward_return
  horizon: 5
preprocess:
  winsorize: false
  winsorize_lower: 0.01
  winsorize_upper: 0.99
  standardization: none
  min_group_size: 5
transaction_cost:
  one_way_rate: 0.001
output:
  root_dir: dist/web_ui_runs
