name: demo_model_factor_case
factor_name: model_alpha_demo
features_path: ../../../data/processed/real_case_inputs/model_factor/features.csv
feature_columns:
  - feature_momentum
  - feature_quality
  - feature_noise
prices_path: ../../../data/processed/real_case_inputs/model_factor/prices.csv
rebalance_frequency: W
n_quantiles: 5
direction: long
universe:
  name: default
target:
  kind: forward_return
  horizon: 5
feature_preprocess:
  missing_policy: median_impute
  scale_features: auto
model:
  family: ridge
  params:
    alpha: 1.0
training:
  window_type: rolling
  train_window_n_dates: 60
  min_train_dates: 40
  min_train_rows: 200
  retrain_every_n_dates: 5
  min_score_assets: 20
neutralization:
  enabled: false
transaction_cost:
  one_way_rate: 0.001
output:
  root_dir: ../../../outputs/real_cases
